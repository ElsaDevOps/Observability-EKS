name: Deploy Platform Tools

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: exporter-cluster-${{ github.event.inputs.environment }}

jobs:
  deploy-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::313196411727:role/git-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Fetch IRSA role ARNs, email and VPC ID
        run: |
          echo "LB_ROLE_ARN=$(aws ssm get-parameter --name /${{ github.event.inputs.environment }}/platform/lb-controller-role-arn --with-decryption --query Parameter.Value --output text)" >> $GITHUB_ENV
          echo "CERT_MANAGER_ROLE_ARN=$(aws ssm get-parameter --name /${{ github.event.inputs.environment }}/platform/cert-manager-role-arn --with-decryption --query Parameter.Value --output text)" >> $GITHUB_ENV
          echo "EXTERNAL_DNS_ROLE_ARN=$(aws ssm get-parameter --name /${{ github.event.inputs.environment }}/platform/external-dns-role-arn --with-decryption --query Parameter.Value --output text)" >> $GITHUB_ENV
          echo "EMAIL_ADDRESS=${{ vars.EMAIL_ADDRESS }}" >> $GITHUB_ENV
                    echo "VPC_ID=$(aws ssm get-parameter --name /${{ github.event.inputs.environment }}/platform/vpc-id --with-decryption --query Parameter.Value --output text)" >> $GITHUB_ENV

      - name: Install Gateway API CRDs
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml

      - name: Add EKS Helm repo
        run: helm repo add eks https://aws.github.io/eks-charts && helm repo update
      - name: Clean stuck LB Controller release
        run: helm uninstall aws-load-balancer-controller -n kube-system --ignore-not-found
      - name: Install AWS Load Balancer Controller
        run: |
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set vpcId=${{ env.VPC_ID }} \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ env.LB_ROLE_ARN }} \
            --wait


      - name: Debug LB Controller
        if: failure()
        run: |
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
          kubectl describe pod -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
          kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=50
      - name: Add Jetstack Helm repo
        run: helm repo add jetstack https://charts.jetstack.io && helm repo update

      - name: Install CertManager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --set serviceAccount.name=cert-manager \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ env.CERT_MANAGER_ROLE_ARN }} \
            --wait

      - name: Apply ClusterIssuer
        run: envsubst < infra/platform/C:\Users\Hinat\Observability-EKS\infra\platform\clusterissuer-lets-encrypt-staging.yaml | kubectl apply -f -

      - name: Add ExternalDNS Helm repo
        run: helm repo add external-dns https://kubernetes-sigs.github.io/external-dns && helm repo update

      - name: Install ExternalDNS
        run: |
          helm upgrade --install external-dns external-dns/external-dns \
            --namespace external-dns \
            --create-namespace \
            --set serviceAccount.name=external-dns \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ env.EXTERNAL_DNS_ROLE_ARN }} \
            --set provider.name=aws \
            --wait

      - name: Add Prometheus Community repo
        run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts && helm repo update

      - name: Install kube-prometheus-stack
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait

      - name: Add ArgoCD Helm repo
        run: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update

      - name: Install ArgoCD
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --wait
