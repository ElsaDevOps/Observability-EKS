name: Deploy Platform Tools

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: exporter-cluster-${{ github.event.inputs.environment }}

jobs:
  deploy-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}


      - name: Install Gateway API CRDs
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml


      - name: Add EKS Helm repo
        run: helm repo add eks https://aws.github.io/eks-charts && helm repo update

      - name: Install AWS Load Balancer Controller
        run: |
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"= # TODO \
            --wait


      - name: Add Jetstack Helm repo
        run: helm repo add jetstack https://charts.jetstack.io && helm repo update

      - name: Install CertManager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --set serviceAccount.name=cert-manager \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"= # TODO \
            --wait


      - name: Apply ClusterIssuer
        run: kubectl apply -f # TODO: path to ClusterIssuer manifest


      - name: Add ExternalDNS Helm repo
        run: helm repo add external-dns https://kubernetes-sigs.github.io/external-dns && helm repo update

      - name: Install ExternalDNS
        run: |
          helm upgrade --install external-dns external-dns/external-dns \
            --namespace external-dns \
            --create-namespace \
            --set serviceAccount.name=external-dns \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"= # TODO \
            --set provider.name=aws \
            --wait


      - name: Add Prometheus Community repo
        run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts && helm repo update

      - name: Install kube-prometheus-stack
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait


      - name: Add ArgoCD Helm repo
        run: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update

      - name: Install ArgoCD
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --wait
