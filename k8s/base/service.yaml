apiVersion: v1
kind: Service
metadata:
  name: exporter-svc
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: exporter
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP